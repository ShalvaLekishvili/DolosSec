[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dolossec-agent"
version = "0.5.0"
description = "Policy-gated autonomous application security research agent"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "DolosSec" }]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.9,<15",
  "typer>=0.12,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
ai = ["openai>=2.45,<3"]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.11,<1"]

[project.scripts]
dolos = "dolossec.cli:app"

[tool.setuptools.packages.find]
include = ["dolossec*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.setuptools.package-data]
"dolossec.web" = ["static/*"]
